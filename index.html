<!DOCTYPE html>

<title>Dodo | Official Bio</title>

<!-- ============================================================
     ANTI-INSPECT / ANTI-DEVTOOLS PROTECTION
     ============================================================ -->
<script>
(function(){
  'use strict';

  /* 1. Disable right-click context menu */
  document.addEventListener('contextmenu', function(e){
    e.preventDefault();
    return false;
  });

  /* 2. Block keyboard shortcuts: F12, Ctrl+Shift+I/J/C/U, Ctrl+U, Ctrl+S */
  document.addEventListener('keydown', function(e){
    var k = e.key || e.keyCode;
    // F12
    if (k === 'F12' || k === 123) { e.preventDefault(); return false; }
    // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C / Ctrl+Shift+K
    if (e.ctrlKey && e.shiftKey && (k==='I'||k==='i'||k===73 ||
                                    k==='J'||k==='j'||k===74 ||
                                    k==='C'||k==='c'||k===67 ||
                                    k==='K'||k==='k'||k===75)) {
      e.preventDefault(); return false;
    }
    // Ctrl+U (view source)
    if (e.ctrlKey && (k==='U'||k==='u'||k===85)) { e.preventDefault(); return false; }
    // Ctrl+S (save page)
    if (e.ctrlKey && (k==='S'||k==='s'||k===83)) { e.preventDefault(); return false; }
    // Ctrl+P (print)
    if (e.ctrlKey && (k==='P'||k==='p'||k===80)) { e.preventDefault(); return false; }
  });

  /* 3. DevTools size-change detector */
  var _threshold = 160;
  var _devOpen   = false;
  function _checkDevTools(){
    var w = window.outerWidth  - window.innerWidth;
    var h = window.outerHeight - window.innerHeight;
    if (w > _threshold || h > _threshold) {
      if (!_devOpen) {
        _devOpen = true;
        _onDevToolsOpen();
      }
    } else {
      _devOpen = false;
    }
  }
  function _onDevToolsOpen(){
    // Redirect to blank / wipe page content
    document.body.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0a;color:#ff4444;font-family:monospace;font-size:1.4rem;text-align:center;">' +
      '🚫 Akses DevTools tidak diizinkan.<br><small style="color:#888;font-size:.8rem;margin-top:.5rem;display:block;">Tutup DevTools & refresh halaman.</small>' +
      '</div>';
  }
  setInterval(_checkDevTools, 500);

  /* 4. debugger trap — makes continuous debugging very slow */
  (function _trap(){
    (function(){ return false; })['constructor']('debugger')();
    setTimeout(_trap, 50);
  })();

  /* 5. Disable text selection (optional UX choice) */
  document.addEventListener('selectstart', function(e){ e.preventDefault(); });

  /* 6. Disable drag */
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });

})();
</script>

<script src="script.js" defer></script>

<!-- Override WA / Telegram / Repo links after script.js renders -->
<script>
document.addEventListener('DOMContentLoaded', function(){

  /* ── WhatsApp link ── */
  document.querySelectorAll('a[href*="wa.me"]').forEach(function(el){
    el.href = 'https://wa.me/+6288212461534';
  });

  /* ── Telegram link ── */
  document.querySelectorAll('a[href*="t.me"]').forEach(function(el){
    el.href = 'https://t.me/dodoirused';
  });

  /* ── "Dodo Project Repository" → Saluran WhatsApp Official Dodo ── */
  document.querySelectorAll('a[href*="github.com/Crystallize012/Dodo"]').forEach(function(el){
    el.href   = 'https://whatsapp.com/channel/0029Vb5si3ZG8l5GJf8yaC1N';
    el.target = '_blank';
    el.rel    = 'noopener noreferrer';
    // Update teks link jika ada
    if(el.textContent && el.textContent.toLowerCase().includes('reposit')){
      el.textContent = '📢 Saluran WhatsApp Official Dodo';
    }
  });

  /* ── Fallback: cari semua link dengan teks "repository" ── */
  document.querySelectorAll('a').forEach(function(el){
    if(el.textContent && el.textContent.toLowerCase().includes('reposit') &&
       el.href && el.href.includes('github')){
      el.href        = 'https://whatsapp.com/channel/0029Vb5si3ZG8l5GJf8yaC1N';
      el.textContent = '📢 Saluran WhatsApp Official Dodo';
      el.target      = '_blank';
      el.rel         = 'noopener noreferrer';
    }
  });

});
</script>
