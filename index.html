<!DOCTYPE html>
<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dodo | Official Bio</title>

<!-- ██████████████████████████████████████████████████████████
     LAYER 0 — Hide body until security check passes
     ██████████████████████████████████████████████████████████ -->
<style>
  html { visibility: hidden !important; }
</style>

<!-- ██████████████████████████████████████████████████████████
     LAYER 1 — SYNCHRONOUS (runs BEFORE any render)
     ██████████████████████████████████████████████████████████ -->
<script>
!function(){
  "use strict";

  var _dead = false;

  /* ── Nuke page completely ── */
  function _kill() {
    if (_dead) return;
    _dead = true;
    document.open();
    document.write(
      '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>*{margin:0;padding:0}' +
      'body{background:#050505;display:flex;align-items:center;' +
      'justify-content:center;min-height:100vh;flex-direction:column;gap:14px}' +
      'h1{color:#ff3333;font-family:monospace;font-size:2rem;letter-spacing:2px}' +
      'p{color:#555;font-family:monospace;font-size:.82rem;text-align:center;line-height:1.7}' +
      '</style></head><body>' +
      '<h1>\u{1F6AB} AKSES DITOLAK</h1>' +
      '<p>Developer Tools tidak diizinkan.<br>Tutup DevTools &amp; refresh halaman.</p>' +
      '</body></html>'
    );
    document.close();
    try{ window.stop(); }catch(e){}
  }

  /* ── 1. Block all keyboard shortcuts ── */
  function _blockKey(e) {
    var k  = (e.key  || '').toUpperCase();
    var kc = e.keyCode || e.which || 0;
    // F12
    if (kc === 123 || k === 'F12') { e.preventDefault(); e.stopImmediatePropagation(); return false; }
    // Ctrl+Shift+I/J/C/K/U
    if (e.ctrlKey && e.shiftKey && 'IJCKU'.indexOf(k) > -1) {
      e.preventDefault(); e.stopImmediatePropagation(); return false;
    }
    // Ctrl+U / Ctrl+S / Ctrl+P (view-source, save, print)
    if (e.ctrlKey && !e.shiftKey && 'USP'.indexOf(k) > -1) {
      e.preventDefault(); e.stopImmediatePropagation(); return false;
    }
  }
  document.addEventListener('keydown',  _blockKey, true);
  document.addEventListener('keypress', _blockKey, true);
  document.addEventListener('keyup',    _blockKey, true);

  /* ── 2. Block right-click ── */
  document.addEventListener('contextmenu', function(e){
    e.preventDefault(); e.stopImmediatePropagation(); return false;
  }, true);

  /* ── 3. Block select & drag ── */
  document.addEventListener('selectstart', function(e){ e.preventDefault(); }, true);
  document.addEventListener('dragstart',   function(e){ e.preventDefault(); }, true);

  /* ── 4. DevTools window-size detector ── */
  var _threshold = 160;
  function _sizeCheck() {
    if (_dead) return;
    if (window.outerWidth - window.innerWidth   > _threshold) { _kill(); return; }
    if (window.outerHeight - window.innerHeight > _threshold) { _kill(); return; }
  }

  /* ── 5. Debugger timing attack ── */
  function _debugCheck() {
    if (_dead) return;
    var t = performance.now();
    (function(){ return false; })['constructor']('debugger')['call']();
    if (performance.now() - t > 80) _kill();
  }

  /* ── 6. console getter trick (Chrome / Edge) ── */
  function _consoleCheck() {
    if (_dead) return;
    var el   = new Image();
    var open = false;
    Object.defineProperty(el, 'id', { get: function(){ open = true; return ''; } });
    /* eslint-disable no-console */
    (function(c){ c.log(el); c.clear(); })(window.console);
    if (open) _kill();
  }

  /* ── 7. toString sentinel (DevTools evaluates objects → triggers it) ── */
  var _sentinel = {
    toString: function(){ _kill(); return ''; },
    valueOf:  function(){ _kill(); return 0;  }
  };

  /* ── 8. Firebug legacy ── */
  function _firebugCheck() {
    if (_dead) return;
    if (window.Firebug && window.Firebug.chrome && window.Firebug.chrome.isInitialized) _kill();
  }

  /* ── 9. Silence console (prevent info leakage) ── */
  var _noop = function(){};
  try {
    ['log','warn','error','info','debug','trace','table','dir','dirxml','group','groupEnd','time','timeEnd']
      .forEach(function(m){ try{ console[m] = _noop; }catch(ex){} });
  } catch(ex) {}

  /* ── Master polling loop — 80ms interval ── */
  function _loop() {
    _sizeCheck();
    _debugCheck();
    _firebugCheck();
    /* Ping sentinel to console every tick */
    try{ (function(c){ c.log(_sentinel); c.clear(); })(window.console); }catch(e){}
    if (!_dead) setTimeout(_loop, 80);
  }

  /* ── Reveal page ONLY after first checks pass, then start loop ── */
  window.addEventListener('load', function(){
    _sizeCheck();
    _debugCheck();
    _consoleCheck();
    _firebugCheck();
    if (!_dead) {
      document.documentElement.style.visibility = 'visible';
      _loop();
    }
  });

}();
</script>

});
</script>
